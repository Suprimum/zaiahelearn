{% extends "base.html" %}
{% block content %}

<h3 class="fw-bold mb-4">My Lessons</h3>

<a href="{% url 'courses:lesson_create' %}" class="btn btn-success mb-3">
    <i class="fas fa-plus"></i> New Lesson
</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Title</th>
            <th>Course</th>
            <th>Status</th>
            <th>Updated</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for lesson in lessons %}
        <tr>
            <td>{{ lesson.title }}</td>
            <td>{{ lesson.course }}</td>
            <td>
                <span class="badge {% if lesson.status == 'published' %}bg-success{% else %}bg-secondary{% endif %}">
                    {{ lesson.status }}
                </span>
            </td>
            <td>{{ lesson.updated_at|date:"M d, Y" }}</td>
            <td>
                <a href="{% url 'courses:lesson_edit' lesson.id %}" class="btn btn-sm btn-outline-primary">
                    Edit
                </a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
