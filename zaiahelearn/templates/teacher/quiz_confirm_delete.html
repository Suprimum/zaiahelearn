{% extends "base.html" %}

{% block hero-section %}
<section class="hero-section bg-danger text-white text-center">
  <div class="container">
    <h1 class="display-5 fw-bold">Delete Quiz</h1>
    <p class="lead mt-2">
      This action is permanent and cannot be undone.
    </p>
  </div>
</section>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

      <div class="card shadow-sm border-danger">
        <div class="card-body text-center p-4">

          <h4 class="fw-bold mb-3">Confirm Deletion</h4>

          <p class="mb-4">
            Are you sure you want to delete the quiz:
            <br>
            <strong class="text-danger">“{{ quiz.title }}”</strong>?
          </p>

          <form method="post" action="{% url 'courses:quiz_delete' quiz.id %}">
            {% csrf_token %}
            <div class="d-flex justify-content-between">
              <a href="{% url 'courses:lesson_quiz_list' quiz.lesson.id %}"
                 class="btn btn-outline-secondary">
                Cancel
              </a>

              <button type="submit" class="btn btn-danger">
                🗑️ Yes, Delete Quiz
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
